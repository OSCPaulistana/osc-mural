<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mural OSC</title>
  <link rel="icon" href="/assets/branding/osc-simbolo.png">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/widget.css">
</head>
<body>
  <main class="painel" id="painel">
    <header class="topo">
      <img class="simbolo" src="/assets/branding/osc-simbolo.png" alt="">
      <img class="simbolo" src="/assets/branding/paulistana-simbolo.png" alt="">
      <strong class="nome">Mural OSC</strong>
      <span class="data" id="data"></span>
      <button class="recolher" id="btn-recolher" title="Recolher" aria-label="Recolher o mural">
        <i class="ic" style="--i:url(/icones/panel-right-close.svg)"></i>
      </button>
    </header>

    <section class="bloco-sistemas" id="bloco-sistemas">
      <div class="cab-sistemas">
        <div class="abas" id="abas" role="tablist" aria-label="Páginas de atalhos"></div>
        <button class="mini" id="btn-personalizar" title="Escolher e ordenar os atalhos" aria-label="Personalizar atalhos">
          <i class="ic" style="--i:url(/icones/sliders-horizontal.svg)"></i>
        </button>
      </div>
      <nav class="sistemas" id="sistemas" aria-label="Sistemas"></nav>
      <div class="personalizar" id="personalizar" hidden>
        <p>Escolha quais atalhos aparecem neste computador e a ordem deles.</p>
        <div class="lista-personalizar" id="lista-personalizar"></div>
        <div class="acoes-personalizar">
          <button class="link" id="p-restaurar" type="button">Restaurar padrão</button>
          <button class="botao" id="p-concluir" type="button">Concluir</button>
        </div>
      </div>
    </section>

    <section class="secao avisos">
      <h2>Avisos <span class="n" id="n-avisos"></span></h2>
      <div class="rolagem" id="avisos"></div>
    </section>

    <section class="secao" id="bloco-secao">
      <h2 id="secao-titulo">Agenda</h2>
      <div class="rolagem" id="secao-corpo"></div>
    </section>

    <section class="galeria" id="galeria" hidden>
      <h2>Fotos <span class="n" id="g-contagem"></span><button class="link ver-todas" id="btn-galeria" type="button">Ver álbuns</button></h2>
      <div class="palco" id="palco" title="Clique para abrir a galeria">
        <div class="legenda">
          <strong id="g-legenda"></strong>
          <span id="g-data"></span>
        </div>
        <div class="progresso"><i id="g-barra"></i></div>
      </div>
    </section>

    <p class="offline" id="offline" hidden>Sem conexão. Mostrando o último conteúdo recebido.</p>
  </main>

  <aside class="trilho" id="trilho" hidden>
    <button class="recolher" id="btn-expandir" title="Abrir o mural" aria-label="Abrir o mural">
      <i class="ic" style="--i:url(/icones/panel-right-open.svg)"></i>
    </button>
    <button class="sino" id="trilho-avisos" title="Avisos">
      <i class="ic" style="--i:url(/icones/bell.svg)"></i>
      <span class="bolha" id="trilho-bolha"></span>
    </button>
    <div class="trilho-sistemas" id="trilho-sistemas"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="visor" id="visor" hidden>
    <button class="visor-fechar" id="visor-fechar" type="button" aria-label="Fechar a foto">
      <i class="ic" style="--i:url(/icones/x.svg)"></i>
    </button>
    <img id="visor-img" alt="">
    <p id="visor-legenda"></p>
  </div>

  <script src="/assets/widget.js"></script>
</body>
</html>
